name: CI/CD MLflow Project Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow dagshub

      - name: Validate MLProject Structure
        run: |
          cd MLProject
          test -f MLproject && echo "✅ MLproject found"
          test -f modelling.py && echo "✅ modelling.py found"
          test -f conda.yaml && echo "✅ conda.yaml found"
          test -f diabetes_preprocessing/diabetes_preprocessed.csv && echo "✅ Dataset found"

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . -P data_path=diabetes_preprocessing/diabetes_preprocessed.csv
